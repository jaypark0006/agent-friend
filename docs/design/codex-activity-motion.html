<div id="mosaico-motion-study">
  <div class="viz-carousel viz-dotted-background" aria-label="顿悟效果方案" data-previous-label="上一种" data-next-label="下一种">
    <section data-variant="光核展开" aria-label="光核展开动画方案">
      <div class="ms-stage" data-scene="orb">
        <div class="ms-screen">
          <canvas width="480" height="480" role="img" aria-label="活动光核，随所选状态改变动作">Codex 活动动画样稿</canvas>
          <div class="ms-top"><span>CODEX</span><span>活动屏</span></div>
          <div class="ms-copy"><div class="ms-eyebrow">进行中</div><h2>正在梳理思路</h2><p>让零散的线索逐渐清晰</p></div>
          <div class="ms-bottom"><span class="ms-dot"></span><span class="ms-state" aria-live="polite">工作中</span><span class="ms-sample">效果样稿</span></div>
        </div>
        <div class="ms-controls" aria-label="触发活动状态">
          <button class="btn btn-primary" type="button" data-event="insight">播放顿悟</button>
          <button class="btn" type="button" data-event="working" aria-pressed="true">工作中</button>
          <button class="btn" type="button" data-event="waiting" aria-pressed="false">等待</button>
          <button class="btn" type="button" data-event="done" aria-pressed="false">完成</button>
          <button class="btn btn-ghost" type="button" data-pause>暂停动画</button>
        </div>
      </div>
    </section>
    <section data-variant="思路连成星图" aria-label="思路连成星图动画方案" hidden>
      <div class="ms-stage" data-scene="constellation">
        <div class="ms-screen">
          <canvas width="480" height="480" role="img" aria-label="散落的线索，顿悟时汇聚成连通的星图">Codex 活动动画样稿</canvas>
          <div class="ms-top"><span>CODEX</span><span>活动屏</span></div>
          <div class="ms-copy"><div class="ms-eyebrow">进行中</div><h2>正在梳理思路</h2><p>让零散的线索逐渐清晰</p></div>
          <div class="ms-bottom"><span class="ms-dot"></span><span class="ms-state" aria-live="polite">工作中</span><span class="ms-sample">效果样稿</span></div>
        </div>
        <div class="ms-controls" aria-label="触发活动状态">
          <button class="btn btn-primary" type="button" data-event="insight">播放顿悟</button>
          <button class="btn" type="button" data-event="working" aria-pressed="true">工作中</button>
          <button class="btn" type="button" data-event="waiting" aria-pressed="false">等待</button>
          <button class="btn" type="button" data-event="done" aria-pressed="false">完成</button>
          <button class="btn btn-ghost" type="button" data-pause>暂停动画</button>
        </div>
      </div>
    </section>
  </div>
  <div class="viz-row text-small" style="margin-top:12px"><span>480 × 480 · 动画样稿 · 未接入实时活动</span></div>
</div>
<style>
  #mosaico-motion-study .ms-stage {
    --ms-bg: light-dark(#f2f7f5, #10191d);
    --ms-fg: light-dark(#1c343b, #eaf4f2);
    --ms-soft: light-dark(#51666c, #a3b5b8);
    --ms-line: light-dark(#d3e1df, #2a3a40);
    --ms-work: light-dark(#138176, #78e2cd);
    --ms-insight: light-dark(#a36b19, #f2ce8d);
    --ms-wait: light-dark(#7454ab, #bba5e0);
    --ms-done: light-dark(#247654, #8dd9a9);
    --ms-active: var(--ms-work);
    padding: 20px 12px 12px;
  }
  #mosaico-motion-study .ms-screen {
    position: relative;
    width: min(100%, 480px);
    aspect-ratio: 1;
    margin: 0 auto;
    overflow: hidden;
    border-radius: 28px;
    background: var(--ms-bg);
    color: var(--ms-fg);
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", sans-serif;
  }
  #mosaico-motion-study canvas { width: 100%; height: 100%; display: block; }
  #mosaico-motion-study .ms-top {
    position: absolute; inset: 6% 7% auto;
    display: flex; justify-content: space-between;
    font-size: 12px; font-weight: 500; letter-spacing: 2px; color: var(--ms-soft);
  }
  #mosaico-motion-study .ms-copy { position: absolute; top: 68%; left: 7%; right: 7%; }
  #mosaico-motion-study .ms-eyebrow { font-size: 12px; letter-spacing: 2px; color: var(--ms-active); }
  #mosaico-motion-study .ms-copy h2 { margin: 6px 0; font-size: clamp(20px, 4.5vw, 28px); line-height: 1.2; font-weight: 500; color: var(--ms-fg); }
  #mosaico-motion-study .ms-copy p { margin: 0; font-size: 12px; line-height: 1.5; color: var(--ms-soft); }
  #mosaico-motion-study .ms-bottom {
    position: absolute; inset: auto 7% 5%; display: flex; align-items: center; gap: 7px;
    color: var(--ms-soft); font-size: 12px;
  }
  #mosaico-motion-study .ms-dot { width: 5px; height: 5px; background: var(--ms-active); border-radius: 50%; }
  #mosaico-motion-study .ms-sample { margin-left: auto; }
  #mosaico-motion-study .ms-controls { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; margin-top: 16px; }
  @media(max-width: 380px) {
    #mosaico-motion-study .ms-stage { padding: 14px 4px 12px; }
    #mosaico-motion-study .ms-copy { top: 65%; }
    #mosaico-motion-study .ms-copy h2 { margin: 4px 0; }
    #mosaico-motion-study .ms-bottom { bottom: 4%; }
  }
</style>
<script>
(() => {
  const root = document.getElementById('mosaico-motion-study');
  const reducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)');
  const settings = { duration: 2.8, glow: 1 };
  const copy = {
    working: ['进行中', '正在梳理思路', '让零散的线索逐渐清晰', '工作中'],
    insight: ['顿悟', '找到关键联系', '思路接上了，继续向前', '发现关键线索'],
    waiting: ['等待你', '在这里等你', '你准备好后，我们继续', '等待输入'],
    done: ['已完成', '这一步，完成了', '让结果安静地留在这里', '完成']
  };
  const tokens = { working: '--ms-work', insight: '--ms-insight', waiting: '--ms-wait', done: '--ms-done' };
  const clamp = (v, lo = 0, hi = 1) => Math.max(lo, Math.min(hi, v));
  const ease = v => { const x = clamp(v); return x * x * (3 - 2 * x); };
  const mix = (a, b, t) => a + (b - a) * t;
  const stages = Array.from(root.querySelectorAll('.ms-stage')).map(element => {
    const canvas = element.querySelector('canvas');
    return { element, canvas, ctx: canvas.getContext('2d'), variant: element.closest('[data-variant]'),
      scene: element.dataset.scene, state: 'working', elapsed: 0, clock: 0,
      paused: reducedMotion.matches, visible: true, palette: {} };
  });

  function recolor(stage) {
    const probe = document.createElement('span');
    probe.hidden = true;
    stage.element.appendChild(probe);
    for (const [key, token] of Object.entries({ ...tokens, line: '--ms-line', fg: '--ms-fg' })) {
      probe.style.color = `var(${token})`;
      stage.palette[key] = getComputedStyle(probe).color;
    }
    probe.remove();
  }

  function updateText(stage) {
    const text = copy[stage.state];
    stage.element.querySelector('.ms-eyebrow').textContent = text[0];
    stage.element.querySelector('h2').textContent = text[1];
    stage.element.querySelector('.ms-copy p').textContent = text[2];
    stage.element.querySelector('.ms-state').textContent = text[3];
    stage.canvas.setAttribute('aria-label', `${stage.variant.dataset.variant}：${text[3]}`);
    stage.element.style.setProperty('--ms-active', `var(${tokens[stage.state]})`);
    for (const button of stage.element.querySelectorAll('[aria-pressed]')) {
      button.setAttribute('aria-pressed', String(button.dataset.event === stage.state));
    }
    stage.element.querySelector('[data-pause]').textContent = stage.paused ? '播放动画' : '暂停动画';
  }

  function remember(stage) {
    if (!window.openai?.setWidgetState) return;
    window.openai.setWidgetState({
      modelContent: { animationStyle: stage.variant.dataset.variant, event: stage.state, insightSeconds: settings.duration },
      privateContent: { duration: settings.duration, glow: settings.glow,
        scenes: stages.map(s => ({ scene: s.scene, event: s.state, paused: s.paused })) }
    }).catch(() => {});
  }

  function restore(saved) {
    const values = saved?.privateContent;
    if (!values) return;
    if (Number.isFinite(values.duration)) settings.duration = clamp(values.duration, 1.8, 4);
    if (Number.isFinite(values.glow)) settings.glow = clamp(values.glow, 0.5, 1.5);
    for (const stage of stages) {
      const state = Array.isArray(values.scenes) && values.scenes.find(s => s.scene === stage.scene);
      if (state && Object.hasOwn(copy, state.event)) {
        stage.state = state.event;
        stage.paused = reducedMotion.matches || state.paused === true;
        stage.elapsed = stage.paused ? (stage.state === 'insight' ? settings.duration * 0.48 : stage.state === 'done' ? 1.5 : 0) : 0;
      }
    }
  }

  function select(stage, event) {
    stage.state = event;
    stage.elapsed = stage.paused ? (event === 'insight' ? settings.duration * 0.48 : event === 'done' ? 1.5 : 0) : 0;
    updateText(stage);
    remember(stage);
    draw(stage);
  }

  function dot(ctx, x, y, radius, color, alpha = 1) {
    ctx.globalAlpha = clamp(alpha);
    ctx.fillStyle = color;
    ctx.beginPath(); ctx.arc(x, y, Math.max(0.1, radius), 0, Math.PI * 2); ctx.fill();
  }

  function glow(ctx, x, y, radius, color, strength) {
    for (let i = 8; i > 0; i--) dot(ctx, x, y, radius * i / 8, color, 0.012 * strength);
  }

  function path(ctx, points, color, alpha, width = 1) {
    if (points.length < 2) return;
    ctx.globalAlpha = clamp(alpha); ctx.strokeStyle = color; ctx.lineWidth = width;
    ctx.beginPath(); ctx.moveTo(points[0][0], points[0][1]);
    points.slice(1).forEach(p => ctx.lineTo(p[0], p[1])); ctx.stroke();
  }

  function draw(stage) {
    const ctx = stage.ctx;
    if (!ctx) return;
    const p = stage.palette;
    ctx.clearRect(0, 0, 480, 480);
    ctx.lineCap = 'round'; ctx.lineJoin = 'round';
    const insight = stage.state === 'insight';
    const done = stage.state === 'done';
    const waiting = stage.state === 'waiting';
    const f = insight ? clamp(stage.elapsed / settings.duration) : 0;
    const gather = insight ? ease(f / 0.24) * (1 - ease((f - 0.30) / 0.25)) : 0;
    const bloom = insight ? Math.sin(Math.PI * ease((f - 0.24) / 0.70)) : 0;
    const expansion = insight ? ease((f - 0.29) / 0.43) : 0;
    const calm = done ? ease(stage.elapsed / 1.4) : 0;
    const movement = done ? Math.min(stage.elapsed, 1.4) * 0.25 : waiting ? stage.clock * 0.09 : stage.clock * 0.30;
    const breathing = done ? 0 : Math.sin(stage.clock * (waiting ? 1 : 1.7)) * 2;
    const color = p[stage.state];
    const cx = 240, cy = 204;

    // One bounded glow, no full-screen flashes or repeated insight pulses.
    glow(ctx, cx, cy, 100 + bloom * 65, color, settings.glow * (0.5 + bloom * 2));
    if (stage.scene === 'orb') {
      const radius = (66 + breathing) * (1 - gather * 0.32 + bloom * 0.15);
      for (let ring = 0; ring < 7; ring++) {
        const tilt = ring * Math.PI / 7 + movement * 0.32;
        const points = [];
        for (let j = 0; j <= 96; j++) {
          const a = j * Math.PI / 48;
          const x = Math.cos(a) * radius;
          const y = Math.sin(a) * radius * (0.28 + 0.10 * Math.sin(tilt));
          points.push([cx + x * Math.cos(tilt) - y * Math.sin(tilt), cy + x * Math.sin(tilt) + y * Math.cos(tilt)]);
        }
        path(ctx, points, color, 0.23 + bloom * 0.14, 1.1);
      }
      for (let i = 0; i < 70; i++) {
        const z = 1 - 2 * (i + 0.5) / 70;
        const a = i * 2.399963 + movement;
        const r = Math.sqrt(1 - z * z);
        const depth = Math.sin(a) * r;
        dot(ctx, cx + Math.cos(a) * r * radius, cy + z * radius,
          0.8 + (depth + 1) * 0.6, color, 0.25 + (depth + 1) * 0.26);
      }
      dot(ctx, cx, cy, 5 + bloom * 8, color, 0.8);
      glow(ctx, cx, cy, 22 + bloom * 13, color, settings.glow * 1.8);
      for (let i = 0; i < 12; i++) {
        const a = i * Math.PI / 6 + movement * 0.25;
        const r = (108 + Math.sin(i * 1.4 + movement) * 9) * (1 - gather * 0.66);
        dot(ctx, cx + Math.cos(a) * r, cy + Math.sin(a) * r * 0.83,
          1.4, color, 0.18 + bloom * 0.25);
      }
    } else {
      const connection = done ? calm : insight ? ease((f - 0.15) / 0.38) : waiting ? 0.05 : 0.12;
      const points = [];
      for (let i = 0; i < 15; i++) {
        const a = i * 2.399963;
        const r = 28 + Math.sqrt(i / 14) * 87;
        const drift = (1 - connection) * 10;
        const targetX = cx + Math.cos(a) * r;
        const targetY = cy + Math.sin(a) * r * 0.78;
        const x = mix(targetX + Math.sin(movement + i) * drift, targetX, connection);
        const y = mix(targetY + Math.cos(movement * 0.7 + i * 2) * drift, targetY, connection);
        points.push([x, y]);
      }
      for (let i = 1; i < points.length; i++) {
        const parent = Math.floor((i - 1) / 2);
        const progress = ease(connection * 2.3 - i / 14);
        const endpoint = [mix(points[parent][0], points[i][0], progress), mix(points[parent][1], points[i][1], progress)];
        path(ctx, [points[parent], endpoint], color, 0.25 + bloom * 0.35, 1.5);
      }
      points.forEach(([x, y], i) => {
        dot(ctx, x, y, (i === 0 ? 6 : 2.5) + bloom * 1.7, color, 0.55 + connection * 0.4);
        if (connection > 0.3) glow(ctx, x, y, 15, color, settings.glow * connection);
      });
    }
    if (insight && f > 0.29) {
      const radius = 34 + expansion * 114;
      const points = [];
      for (let i = 0; i <= 128; i++) {
        const a = i * Math.PI / 64;
        points.push([cx + Math.cos(a) * radius, cy + Math.sin(a) * radius * 0.73]);
      }
      path(ctx, points, color, Math.sin(Math.PI * expansion) * 0.75, 1.8);
      for (let i = 0; i < 18; i++) {
        const a = i * Math.PI / 9 + 0.2;
        dot(ctx, cx + Math.cos(a) * radius, cy + Math.sin(a) * radius * 0.73,
          1 + bloom, color, (1 - expansion) * 0.65);
      }
    }
    if (done) {
      const points = [];
      for (let i = 0; i <= 100 * calm; i++) {
        const a = -Math.PI / 2 + i * Math.PI / 50;
        points.push([cx + Math.cos(a) * 106, cy + Math.sin(a) * 106]);
      }
      path(ctx, points, color, 0.35, 1.5);
    }
    ctx.globalAlpha = 1;
  }

  restore(window.openai?.widgetState);
  stages.forEach(stage => {
    recolor(stage); updateText(stage); draw(stage);
    stage.element.querySelectorAll('[data-event]').forEach(button => {
      button.addEventListener('click', () => select(stage, button.dataset.event));
    });
    stage.element.querySelector('[data-pause]').addEventListener('click', () => {
      stage.paused = !stage.paused;
      updateText(stage); remember(stage); draw(stage);
    });
  });

  const observer = new IntersectionObserver(entries => {
    for (const entry of entries) {
      const stage = stages.find(s => s.canvas === entry.target);
      if (stage) stage.visible = entry.isIntersecting;
    }
  });
  stages.forEach(stage => observer.observe(stage.canvas));
  const refreshPalette = () => stages.forEach(stage => { recolor(stage); draw(stage); });
  const themeObserver = new MutationObserver(refreshPalette);
  themeObserver.observe(document.documentElement, { attributes: true, attributeFilter: ['class', 'style', 'data-theme'] });
  window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', refreshPalette);
  reducedMotion.addEventListener('change', event => {
    if (event.matches) stages.forEach(stage => { stage.paused = true; updateText(stage); draw(stage); });
  });
  window.addEventListener('openai:set_globals', event => {
    const state = event.detail?.globals?.widgetState;
    if (state) { restore(state); stages.forEach(stage => { updateText(stage); draw(stage); }); }
  });
  let previous = performance.now();
  function tick(now) {
    const dt = Math.min((now - previous) / 1000, 0.05);
    previous = now;
    if (!root.isConnected) { observer.disconnect(); themeObserver.disconnect(); return; }
    if (!document.hidden) for (const stage of stages) {
      if (stage.paused || !stage.visible || stage.variant.hidden) continue;
      if (stage.state === 'done' && stage.elapsed >= 1.5) continue;
      stage.clock += dt; stage.elapsed += dt;
      if (stage.state === 'insight' && stage.elapsed >= settings.duration) {
        stage.state = 'working'; stage.elapsed = 0; updateText(stage);
      }
      draw(stage);
    }
    requestAnimationFrame(tick);
  }
  requestAnimationFrame(tick);
  if (globalThis.Tweak) {
    const tweak = new Tweak({ container: root, onChange: () => {
      stages.forEach(draw);
      const stage = stages.find(s => !s.variant.hidden) || stages[0];
      remember(stage);
    } });
    tweak.addSlider(settings, 'duration', { label: '顿悟时长', min: 1.8, max: 4, step: 0.1, unit: '秒' });
    tweak.addSlider(settings, 'glow', { label: '光晕强度', min: 0.5, max: 1.5, step: 0.1 });
  }
})();
</script>
