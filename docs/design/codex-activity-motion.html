<div id="mosaico-liquid-study" aria-label="纯动画活动屏">
  <div class="ml-stage viz-dotted-background">
    <div class="ml-screen" aria-label="液态金属交织流动；顿悟时舒展，等待时悬停，完成时收束">
      <canvas width="480" height="480" role="img" aria-label="三维活动动画">三维活动动画需要 WebGL 2</canvas>
    </div>
  </div>
  <div class="viz-controls" style="justify-content:center;margin-top:16px" aria-label="预览动作，不属于设备画面">
    <button type="button" class="btn" data-motion="working" aria-pressed="true">工作</button>
    <button type="button" class="btn btn-primary" data-motion="insight" aria-pressed="false">顿悟</button>
    <button type="button" class="btn" data-motion="waiting" aria-pressed="false">等待</button>
    <button type="button" class="btn" data-motion="done" aria-pressed="false">完成</button>
    <button type="button" class="btn btn-ghost" data-pause>暂停</button>
  </div>
  <div class="viz-row text-small" style="justify-content:center;margin-top:10px">
    <span data-status role="status">正在载入三维材质…</span>
  </div>
</div>
<style>
  #mosaico-liquid-study .ml-stage { padding: 16px 8px; }
  #mosaico-liquid-study .ml-screen {
    --ml-bg: light-dark(#e7e5e3, #07090f);
    --ml-haze: light-dark(#acb8c5, #182239);
    width: min(100%, 480px); aspect-ratio: 1; margin: 0 auto;
    overflow: hidden; background: var(--ml-bg); border-radius: 24px; isolation: isolate;
  }
  #mosaico-liquid-study canvas { display: block; width: 100%; height: 100%; }
</style>
<script type="module">
const root = document.getElementById('mosaico-liquid-study');
const screen = root.querySelector('.ml-screen');
const canvas = root.querySelector('canvas');
const status = root.querySelector('[data-status]');
const pauseButton = root.querySelector('[data-pause]');
const motionButtons = [...root.querySelectorAll('[data-motion]')];
const motionPreference = matchMedia('(prefers-reduced-motion: reduce)');
const settings = { duration: 3.6, radiance: 0.8 };
const state = { mode: 'working', time: 0, elapsed: 0, paused: motionPreference.matches,
  visible: true, opening: 0, heat: 0, scale: 1, drift: 1, finish: 0 };
const labels = { working: '工作', insight: '顿悟', waiting: '等待', done: '完成' };
const clamp = (x, lo = 0, hi = 1) => Math.min(hi, Math.max(lo, x));
const smooth = x => { const t = clamp(x); return t * t * (3 - 2 * t); };
let alive = true;
let ready = false;
let drawStill = () => {};
let dispose = () => {};

function readSaved(saved) {
  const prefs = saved?.privateContent;
  if (!prefs) return;
  if (Number.isFinite(prefs.duration)) settings.duration = clamp(prefs.duration, 2.4, 5);
  if (Number.isFinite(prefs.radiance)) settings.radiance = clamp(prefs.radiance, 0.25, 1.2);
  if (Object.hasOwn(labels, prefs.mode)) state.mode = prefs.mode;
  state.paused = motionPreference.matches || prefs.paused === true;
  state.elapsed = state.paused ? (state.mode === 'insight' ? settings.duration * 0.46 : state.mode === 'done' ? 3 : 0) : 0;
}
function remember() {
  if (window.openai?.setWidgetState) window.openai.setWidgetState({
    modelContent: { design: '纯动画 · 液态结', event: state.mode, insightSeconds: settings.duration },
    privateContent: { ...settings, mode: state.mode, paused: state.paused }
  }).catch(() => {});
}
function controls() {
  motionButtons.forEach(button => button.setAttribute('aria-pressed', String(button.dataset.motion === state.mode)));
  pauseButton.textContent = state.paused ? '播放' : '暂停';
  canvas.setAttribute('aria-label', `液态金属三维动画：${labels[state.mode]}`);
}
function select(mode) {
  state.mode = mode;
  state.elapsed = state.paused ? (mode === 'insight' ? settings.duration * 0.46 : mode === 'done' ? 3 : 0) : 0;
  controls(); remember(); drawStill();
}
readSaved(window.openai?.widgetState);
controls();
motionButtons.forEach(button => { button.disabled = true; button.addEventListener('click', () => select(button.dataset.motion)); });
pauseButton.disabled = true;
pauseButton.addEventListener('click', () => { state.paused = !state.paused; controls(); remember(); drawStill(); });
window.addEventListener('openai:set_globals', event => {
  if (event.detail?.globals?.widgetState) {
    readSaved(event.detail.globals.widgetState); controls(); drawStill();
  }
});
motionPreference.addEventListener('change', event => {
  if (event.matches) { state.paused = true; controls(); drawStill(); }
});

try {
  // Version-pinned static modules; no activity, device, or other data requests.
  const [THREE, { EffectComposer }, { RenderPass }, { UnrealBloomPass }, { OutputPass }] = await Promise.all([
    import('https://esm.sh/three@0.180.0'),
    import('https://esm.sh/three@0.180.0/examples/jsm/postprocessing/EffectComposer.js'),
    import('https://esm.sh/three@0.180.0/examples/jsm/postprocessing/RenderPass.js'),
    import('https://esm.sh/three@0.180.0/examples/jsm/postprocessing/UnrealBloomPass.js'),
    import('https://esm.sh/three@0.180.0/examples/jsm/postprocessing/OutputPass.js')
  ]);
  if (!root.isConnected) throw new Error('closed');
  const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: false, powerPreference: 'low-power' });
  renderer.setPixelRatio(1); renderer.setSize(480, 480, false);
  renderer.outputColorSpace = THREE.SRGBColorSpace;
  renderer.toneMapping = THREE.ACESFilmicToneMapping; renderer.toneMappingExposure = 1.15;
  const scene = new THREE.Scene();
  const camera = new THREE.PerspectiveCamera(36, 1, 0.1, 40);
  camera.position.set(0, 0, 5.4);

  // Broad cool studio reflections, a warm edge, and dark gaps between them.
  const studio = new THREE.Scene(); studio.background = new THREE.Color('#0b101c');
  const lampGeometry = new THREE.PlaneGeometry(1, 1);
  const lampMaterials = [];
  function lamp(position, size, rgb, energy) {
    const color = new THREE.Color(rgb).multiplyScalar(energy);
    const material = new THREE.MeshBasicMaterial({ color, side: THREE.DoubleSide });
    lampMaterials.push(material);
    const panel = new THREE.Mesh(lampGeometry, material);
    panel.position.set(...position); panel.scale.set(size[0], size[1], 1); panel.lookAt(0, 0, 0);
    studio.add(panel);
  }
  lamp([-3, 3, 3], [2.2, 6], '#dcefff', 7);
  lamp([4, 0.5, 2], [0.7, 5], '#abc7ff', 6);
  lamp([0, -4, 1], [5, 0.45], '#f1b785', 4);
  lamp([1, 2, -4], [3, 3], '#d2aeed', 5);
  lamp([-4, -0.5, -2], [1, 2.5], '#a4dccf', 2.8);
  const pmrem = new THREE.PMREMGenerator(renderer);
  const environment = pmrem.fromScene(studio, 0.035);
  scene.environment = environment.texture;
  pmrem.dispose(); lampGeometry.dispose(); lampMaterials.forEach(material => material.dispose());
  const keyLight = new THREE.DirectionalLight('#edf3ff', 2.6);
  keyLight.position.set(-3, 4, 5); scene.add(keyLight);
  const warmLight = new THREE.PointLight('#ffc98e', 0, 10, 2);
  warmLight.position.set(0.1, 0.1, 1.5); scene.add(warmLight);

  const uniforms = { uTime: { value: 0 }, uOpen: { value: 0 }, uFinish: { value: 0 } };
  const surfaceCode = `
    uniform float uTime;
    uniform float uOpen;
    uniform float uFinish;
    const float TAU = 6.28318530718;
    vec3 spine(float u) {
      float a = u * TAU;
      float r = 0.70 + 0.30 * cos(3.0 * a + uTime * 0.16);
      vec3 knot = vec3(r * cos(2.0 * a), r * sin(2.0 * a), 0.34 * sin(3.0 * a + uTime * 0.16));
      knot.x += 0.065 * sin(a * 5.0 + uTime * 0.5);
      knot.y += 0.05 * sin(a * 4.0 - uTime * 0.4);
      float petal = 1.08 + 0.11 * cos(5.0 * a + uTime * 0.12);
      vec3 unfolded = vec3(petal * cos(a), petal * sin(a), 0.20 * sin(3.0 * a + uTime * 0.2));
      vec3 sealed = vec3(0.80 * cos(a), 0.80 * sin(a), 0.12 * sin(2.0 * a));
      return mix(mix(knot, unfolded, uOpen), sealed, uFinish);
    }
    vec3 surface(vec2 param) {
      float u = param.x;
      float v = param.y * TAU;
      vec3 c = spine(u);
      vec3 t = normalize(spine(u + 0.0005) - spine(u - 0.0005));
      vec3 n = normalize(cross(t, vec3(0.0, 0.0, 1.0)));
      vec3 b = cross(t, n);
      float radius = mix(0.175, 0.088, uOpen);
      radius = mix(radius, 0.205, uFinish);
      radius *= 1.0 + (1.0 - uFinish) * 0.16 * sin(u * TAU * 3.0 - uTime * 0.65);
      float twist = v + u * TAU * 2.0 + uTime * 0.10;
      float width = mix(1.0, 1.72, uOpen);
      float depth = mix(0.90, 0.52, uOpen);
      return c + n * cos(twist) * radius * width + b * sin(twist) * radius * depth;
    }
  `;
  const surfaceMaterial = new THREE.MeshPhysicalMaterial({
    color: '#aebace', metalness: 0.94, roughness: 0.18, clearcoat: 1, clearcoatRoughness: 0.13,
    iridescence: 0.55, iridescenceIOR: 1.35, iridescenceThicknessRange: [180, 380], envMapIntensity: 1.15,
    emissive: '#ffae52', emissiveIntensity: 0
  });
  surfaceMaterial.onBeforeCompile = shader => {
    Object.assign(shader.uniforms, uniforms);
    shader.vertexShader = shader.vertexShader.replace('#include <common>', '#include <common>\n' + surfaceCode);
    shader.vertexShader = shader.vertexShader.replace('#include <beginnormal_vertex>', `
      vec3 here = surface(uv);
      vec3 du = surface(uv + vec2(0.0003, 0.0)) - surface(uv - vec2(0.0003, 0.0));
      vec3 dv = surface(uv + vec2(0.0, 0.0003)) - surface(uv - vec2(0.0, 0.0003));
      vec3 objectNormal = normalize(cross(dv, du));
      #ifdef USE_TANGENT
        vec3 objectTangent = normalize(du);
      #endif
    `);
    shader.vertexShader = shader.vertexShader.replace('#include <begin_vertex>', 'vec3 transformed = here;');
  };
  surfaceMaterial.customProgramCacheKey = () => 'mosaico-liquid-knot-v2';
  function parametricGrid(columns, rows) {
    const positions = [], uv = [], normals = [], indices = [];
    for (let u = 0; u <= columns; u++) for (let v = 0; v <= rows; v++) {
      positions.push(0, 0, 0); normals.push(0, 0, 1); uv.push(u / columns, v / rows);
      if (u < columns && v < rows) {
        const a = u * (rows + 1) + v, b = a + rows + 1;
        indices.push(a, a + 1, b, a + 1, b + 1, b);
      }
    }
    const geometry = new THREE.BufferGeometry();
    geometry.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));
    geometry.setAttribute('normal', new THREE.Float32BufferAttribute(normals, 3));
    geometry.setAttribute('uv', new THREE.Float32BufferAttribute(uv, 2));
    geometry.setIndex(indices); return geometry;
  }
  const surfaceGeometry = parametricGrid(288, 28);
  const sculpture = new THREE.Mesh(surfaceGeometry, surfaceMaterial); sculpture.frustumCulled = false;
  const body = new THREE.Group(); body.add(sculpture); scene.add(body);
  const beadGeometry = new THREE.SphereGeometry(1, 24, 16);
  const beadMaterial = new THREE.MeshPhysicalMaterial({ color: '#b6c7df', metalness: 0.96,
    roughness: 0.14, clearcoat: 1, iridescence: 0.6, iridescenceIOR: 1.35 });
  const beads = [];
  for (let i = 0; i < 5; i++) { const bead = new THREE.Mesh(beadGeometry, beadMaterial); scene.add(bead); beads.push(bead); }

  // A finite release of sparks, rather than a permanently busy background.
  const seeds = new Float32Array(160 * 3);
  for (let i = 0; i < 160; i++) {
    seeds[i * 3] = ((i * 0.61803398875) % 1) * Math.PI * 2;
    seeds[i * 3 + 1] = ((i * 0.754877666) % 1);
    seeds[i * 3 + 2] = ((i * 0.56984029) % 1);
  }
  const sparkGeometry = new THREE.BufferGeometry();
  sparkGeometry.setAttribute('position', new THREE.BufferAttribute(seeds, 3));
  const sparkMaterial = new THREE.ShaderMaterial({
    uniforms: { uSpread: { value: 0 }, uAlpha: { value: 0 } },
    transparent: true, depthWrite: false, blending: THREE.AdditiveBlending,
    vertexShader: `
      uniform float uSpread; varying float vAlpha;
      void main() {
        float a = position.x + uSpread * (0.4 + position.z);
        float r = 0.55 + uSpread * (0.4 + position.y * 0.95);
        vec3 p = vec3(cos(a) * r, sin(a) * r, (position.z - 0.5) * uSpread * 1.2);
        p.y += uSpread * uSpread * 0.20;
        vec4 mv = modelViewMatrix * vec4(p, 1.0);
        gl_Position = projectionMatrix * mv;
        gl_PointSize = (1.5 + position.z * 2.0) * 4.0 / max(1.0, -mv.z);
        vAlpha = 0.25 + position.y * 0.75;
      }
    `,
    fragmentShader: `
      uniform float uAlpha; varying float vAlpha;
      void main() {
        float d = length(gl_PointCoord - 0.5) * 2.0;
        if (d > 1.0) discard;
        gl_FragColor = vec4(vec3(1.8, 0.95, 0.35), (1.0 - smoothstep(0.15, 1.0, d)) * uAlpha * vAlpha);
      }
    `
  });
  const sparks = new THREE.Points(sparkGeometry, sparkMaterial); sparks.frustumCulled = false; scene.add(sparks);
  const atmosphereMaterial = new THREE.ShaderMaterial({
    uniforms: { uBase: { value: new THREE.Color() }, uHaze: { value: new THREE.Color() }, uHeat: { value: 0 } },
    depthWrite: false, depthTest: false,
    vertexShader: `varying vec2 vUv; void main() { vUv = uv; gl_Position = vec4(position.xy, 0.9999, 1.0); }`,
    fragmentShader: `
      varying vec2 vUv; uniform vec3 uBase; uniform vec3 uHaze; uniform float uHeat;
      void main() {
        vec2 p = vUv - 0.5;
        float haze = exp(-dot(p * vec2(1.0, 1.2), p * vec2(1.0, 1.2)) * 10.0);
        float center = exp(-dot(p, p) * 32.0);
        vec3 color = mix(uBase, uHaze, haze * 0.32);
        color += vec3(0.25, 0.085, 0.018) * center * uHeat;
        float grain = fract(sin(dot(gl_FragCoord.xy, vec2(12.9898,78.233))) * 43758.5453) - 0.5;
        gl_FragColor = vec4(max(vec3(0.0), color + grain * 0.0015), 1.0);
      }
    `
  });
  const atmosphereGeometry = new THREE.PlaneGeometry(2, 2);
  const atmosphere = new THREE.Mesh(atmosphereGeometry, atmosphereMaterial);
  atmosphere.frustumCulled = false; atmosphere.renderOrder = -100; scene.add(atmosphere);
  function applyTheme() {
    const probe = document.createElement('span'); probe.hidden = true; screen.appendChild(probe);
    probe.style.color = 'var(--ml-bg)'; atmosphereMaterial.uniforms.uBase.value.set(getComputedStyle(probe).color);
    probe.style.color = 'var(--ml-haze)'; atmosphereMaterial.uniforms.uHaze.value.set(getComputedStyle(probe).color);
    probe.remove(); if (ready) drawStill();
  }
  applyTheme();
  const target = new THREE.WebGLRenderTarget(480, 480, { type: THREE.HalfFloatType }); target.samples = 4;
  const composer = new EffectComposer(renderer, target);
  const renderPass = new RenderPass(scene, camera);
  const bloom = new UnrealBloomPass(new THREE.Vector2(480, 480), 0.30, 0.45, 1.15);
  const output = new OutputPass();
  composer.addPass(renderPass); composer.addPass(bloom); composer.addPass(output); composer.setSize(480, 480);
  const silver = new THREE.Color('#aebace'), gold = new THREE.Color('#f1c995');
  const tilt = new THREE.Vector2();
  screen.addEventListener('pointermove', event => {
    const rect = screen.getBoundingClientRect();
    tilt.set(((event.clientX - rect.left) / rect.width - 0.5) * 0.18, ((event.clientY - rect.top) / rect.height - 0.5) * 0.18);
    if (state.paused) drawStill();
  });
  screen.addEventListener('pointerleave', () => { tilt.set(0, 0); if (state.paused) drawStill(); });
  function targets() {
    const p = clamp(state.elapsed / settings.duration);
    if (state.mode === 'insight') {
      const charge = smooth(p / 0.20) * (1 - smooth((p - 0.20) / 0.16));
      const opening = smooth((p - 0.19) / 0.26) * (1 - smooth((p - 0.77) / 0.23));
      const heat = smooth((p - 0.16) / 0.18) * (1 - smooth((p - 0.64) / 0.36));
      return { opening, heat, scale: 1 - charge * 0.25 + Math.sin(opening * Math.PI) * 0.045, drift: 0.25, finish: 0,
        spread: smooth((p - 0.32) / 0.60), spark: Math.sin(Math.PI * smooth((p - 0.30) / 0.68)) * 0.8 };
    }
    if (state.mode === 'waiting') return { opening: 0.3, heat: 0, scale: 0.9, drift: 0.12, finish: 0, spread: 0, spark: 0 };
    if (state.mode === 'done') return { opening: 0, heat: 0.12, scale: 0.88, drift: 0.04,
      finish: smooth(state.elapsed / 2), spread: 0, spark: 0 };
    return { opening: 0, heat: 0, scale: 1, drift: 1, finish: 0, spread: 0, spark: 0 };
  }
  function render(dt, instant = false) {
    const next = targets();
    const blend = instant ? 1 : 1 - Math.exp(-dt * 8);
    for (const key of ['opening', 'heat', 'scale', 'drift', 'finish']) state[key] += (next[key] - state[key]) * blend;
    state.time += dt * state.drift;
    uniforms.uTime.value = state.time; uniforms.uOpen.value = state.opening; uniforms.uFinish.value = state.finish;
    surfaceMaterial.color.copy(silver).lerp(gold, state.heat * 0.82 + state.finish * 0.2);
    surfaceMaterial.roughness = 0.18 - state.heat * 0.045;
    surfaceMaterial.emissiveIntensity = state.heat * 0.35 * settings.radiance;
    surfaceMaterial.iridescence = 0.55 * (1 - state.heat * 0.75);
    body.scale.setScalar(state.scale);
    const quiet = 1 - state.finish;
    body.rotation.set(0.26 + Math.sin(state.time * 0.25) * 0.18 * quiet + tilt.y,
      0.18 + Math.sin(state.time * 0.18) * 0.25 * quiet + tilt.x, -0.26 + state.time * 0.09 * quiet);
    body.position.y = Math.sin(state.time * 0.7) * 0.035 * quiet;
    beads.forEach((bead, i) => {
      const a = i * Math.PI * 2 / 5 + state.time * (0.18 + i * 0.012);
      const r = (1.3 + i * 0.07) * (1 - state.opening * 0.05 - state.finish * 0.35);
      bead.position.set(Math.cos(a) * r, Math.sin(a) * r * 0.75, Math.sin(a + 1) * 0.55 - 0.15);
      const size = (0.018 + (i % 3) * 0.012) * (1 - state.finish);
      bead.scale.set(size * 1.1, size * (1.1 + state.heat * 2), size);
    });
    warmLight.intensity = state.heat * 6 * settings.radiance;
    atmosphereMaterial.uniforms.uHeat.value = state.heat * settings.radiance;
    bloom.strength = 0.24 + state.heat * settings.radiance * 0.65;
    sparkMaterial.uniforms.uSpread.value = next.spread; sparkMaterial.uniforms.uAlpha.value = next.spark * settings.radiance;
    sparks.visible = next.spark > 0.001; composer.render();
  }
  drawStill = () => { if (ready && alive) render(0, state.paused); };
  const visibility = new IntersectionObserver(entries => { state.visible = entries[0].isIntersecting; }); visibility.observe(screen);
  const themeObserver = new MutationObserver(applyTheme);
  themeObserver.observe(document.documentElement, { attributes: true, attributeFilter: ['style', 'class', 'data-theme'] });
  const appearance = matchMedia('(prefers-color-scheme: dark)'); appearance.addEventListener('change', applyTheme);
  dispose = () => {
    if (!alive) return;
    alive = false; renderer.setAnimationLoop(null); visibility.disconnect(); themeObserver.disconnect();
    appearance.removeEventListener('change', applyTheme);
    [surfaceGeometry, beadGeometry, sparkGeometry, atmosphereGeometry].forEach(g => g.dispose());
    [surfaceMaterial, beadMaterial, sparkMaterial, atmosphereMaterial].forEach(m => m.dispose());
    environment.dispose(); bloom.dispose(); output.dispose(); composer.dispose(); renderer.dispose();
  };
  canvas.addEventListener('webglcontextlost', event => {
    event.preventDefault(); state.paused = true; controls();
    status.textContent = '三维画面已暂停；重新打开可重新载入。';
    dispose(); motionButtons.forEach(button => { button.disabled = true; }); pauseButton.disabled = true;
  });
  window.addEventListener('pagehide', dispose, { once: true });
  ready = true; motionButtons.forEach(button => { button.disabled = false; }); pauseButton.disabled = false;
  status.textContent = '视觉样稿 · 未连接实时活动或设备';
  render(0, true);
  let previous = performance.now();
  renderer.setAnimationLoop(now => {
    if (!root.isConnected) { dispose(); return; }
    const dt = Math.min((now - previous) / 1000, 0.05); previous = now;
    if (!alive || document.hidden || !state.visible || state.paused) return;
    if (state.mode === 'done' && state.elapsed > 3.2) return;
    state.elapsed += dt;
    if (state.mode === 'insight' && state.elapsed >= settings.duration) { state.mode = 'working'; state.elapsed = 0; controls(); }
    render(dt);
  });
  if (globalThis.Tweak) {
    const tweak = new Tweak({ container: root, onChange: () => { remember(); drawStill(); } });
    tweak.addSlider(settings, 'duration', { label: '顿悟展开时长', min: 2.4, max: 5, step: 0.1, unit: '秒' });
    tweak.addSlider(settings, 'radiance', { label: '发光强度', min: 0.25, max: 1.2, step: 0.05 });
  }
} catch (error) {
  dispose();
  if (root.isConnected) {
    status.textContent = '三维资源未能载入，或当前环境不支持 WebGL 2。'; status.setAttribute('role', 'alert');
    motionButtons.forEach(button => { button.disabled = true; }); pauseButton.disabled = true;
  }
}
</script>
